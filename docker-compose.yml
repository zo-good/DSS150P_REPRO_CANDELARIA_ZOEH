services:
  postgres:
    image: postgres:16
    container_name: dss150p-lab4-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"      # your laptop's 5433 -> the container's 5432
    volumes:
      - pgdata:/var/lib/postgresql/data    # data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  pipeline:
    build: .
    image: dss150p-lab4-pipeline
    container_name: dss150p-lab4-pipeline
    env_file: .env
    environment:
      POSTGRES_HOST: postgres              # inside Docker the DB is reached by service name
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy         # wait until the database accepts connections
    volumes:
      - ./data:/app/data
      - ./metadata:/app/metadata
      - ./outputs:/app/outputs
      - ./state:/app/state
      - ./logs:/app/logs
    command: ["python", "-m", "src.cli", "run-all"]

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: dss150p-lab4-airflow
    container_name: dss150p-lab4-airflow
    command: standalone                     # web UI + scheduler + DAG processor in one container
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      PIPELINE_PROJECT_DIR: /opt/project
      PIPELINE_PYTHON: /opt/pipeline-venv/bin/python
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"   # local lab only: no login screen
    ports:
      - "8080:8080"                         # Airflow UI at http://localhost:8080
    volumes:
      - .:/opt/project                      # the whole project, so tasks read/write your folders
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata: