contract_version: 1
dataset_id: dengue_ph_weekly_41cities
description: >
  Weekly dengue cases (DOH via HDX) joined with weekly-aggregated weather for
  41 Philippine cities, 2016-2021. Used to predict weekly dengue severity.
owner: Zoeh Candelaria (pipeline). Data published by Cirrolytix on HDX.

# what each violation action means
actions:
  fail: stop the pipeline with a nonzero exit code; nothing is written downstream
  quarantine: move the bad rows to data/quarantine/ with a reason column; continue with the rest
  warn: write a warning to the log and continue

sources:
  dengue:
    file: doh-epi-dengue-data-2016-2021.csv
    sha256: e1968c4009ad437e495b890e66a92e3efdb7c913ea49b4764bfdd3dcbabf035f
    on_checksum_mismatch: fail
    required_columns: [loc, cases, deaths, date, Region]
    on_missing_column: fail
    primary_key: [loc, date]
    on_duplicate_key: quarantine
    min_rows: 30000
    on_too_few_rows: fail
    columns:
      loc:    {type: string,  nullable: false, on_violation: quarantine}
      cases:  {type: integer, nullable: false, min: 0, on_violation: quarantine}
      deaths: {type: integer, nullable: true,  min: 0, on_null: warn, on_violation: quarantine}
      date:   {type: date, format: "%m/%d/%Y", nullable: false, weekday: Sunday, on_violation: quarantine}
      Region: {type: string,  nullable: false, on_violation: quarantine}
    row_rules:
      - name: hxl_tag_row
        rule: loc must not start with '#' (HDX label row, not data)
        on_violation: quarantine

  weather:
    files:
      - name: daily_data_combined_2010_to_2019.csv
        sha256: 26665bd48292b9d29800866b862a8c6879137a327509bf10bfd879f02203c175
      - name: daily_data_combined_2020_to_2023.csv
        sha256: 73401480f88b295eddbce46a03efb67998be10e2e49db85a507cff6eddef22cc
    on_checksum_mismatch: fail
    required_columns:
      - city_name
      - datetime
      - precipitation_sum
      - rain_sum
      - temperature_2m_mean
      - temperature_2m_max
      - apparent_temperature_mean
    on_missing_column: fail
    primary_key: [city_name, datetime]
    on_duplicate_key: warn   # known: 4 cities duplicated in 2020-2023; handling is a documented transform setting
    columns:
      city_name:           {type: string, nullable: false, on_violation: quarantine}
      datetime:            {type: date, format: "%Y-%m-%d", nullable: false, on_violation: quarantine}
      precipitation_sum:   {type: float, nullable: false, min: 0, max: 1000, on_violation: quarantine}
      rain_sum:            {type: float, nullable: false, min: 0, max: 1000, on_violation: quarantine}
      temperature_2m_mean: {type: float, nullable: false, min: -5, max: 50, on_violation: quarantine}
      temperature_2m_max:  {type: float, nullable: false, min: -5, max: 55, on_violation: quarantine}
      apparent_temperature_mean: {type: float, nullable: false, min: -10, max: 60, on_violation: quarantine}

# expectations for the model-ready (curated) dataset
curated:
  grain: one row per city per epidemiological week
  primary_key: [loc, date]
  on_duplicate_key: fail
  expected_cities: 41
  target: severity
  allowed_target_values: [Low, Moderate, High]
  label_source: cases   # severity is derived from same-week cases, so cases is never a feature
  forbidden_features: [cases, cases_next, log_cases, deaths, severity]
  rules:
    - name: severity_thresholds_from_train_only
      rule: per-city 33rd/66th percentile thresholds are computed on the training split only
      on_violation: fail
    - name: no_train_test_date_overlap
      rule: every test date is later than every train date
      on_violation: failcontract_version: 1
